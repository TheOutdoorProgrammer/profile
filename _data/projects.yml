# Personal projects and Spacelift-related projects
# Icons: https://icon-sets.iconify.design/

projects:
  - title: Manifests.io
    url: https://www.manifests.io/
    description: "Easy-to-use Kubernetes documentation browser supporting multiple specs including Kubernetes, Istio, Flux, Cert-Manager, and more."
    icon: noto:clipboard

  - title: Crate
    url: https://github.com/TheOutdoorProgrammer/crate
    description: "Self-hosted music manager — search, stream, and download your library through pluggable gRPC providers."
    icon: noto:musical-notes

  - title: Couchpilot
    url: https://github.com/TheOutdoorProgrammer/couchpilot
    description: "Manage Claude Code remote-control sessions from your phone, over iMessage."
    icon: noto:couch-and-lamp

  - title: Boating Accident
    url: https://github.com/TheOutdoorProgrammer/boating-accident
    description: "Self-hosted, encrypted inventory vault for your gear — envelope encryption behind a 6-digit PIN."
    icon: mdi:safe

  - title: Kubagachi Glance
    url: https://github.com/TheOutdoorProgrammer/kubagachi-glance
    description: "Animated Kubernetes 'cluster vitals' critter widget for the Glance dashboard, with an in-widget cluster switcher."
    icon: logos:kubernetes

  - title: The Situation Room (NHL)
    url: https://situationroom.apollorion.com/
    description: "Push notifications from the NHL Situation Room synced to your devices via Pushover, so you know the reasoning behind every call."
    icon: emojione:ice-hockey

  - title: Fly
    url: https://github.com/TheOutdoorProgrammer/fly
    description: "Browser extension that provides quicklinks for engineers to skip sales portals and land directly on the tools you actually use."
    icon: openmoji:space-shuttle

  - title: MAAS 2
    url: https://github.com/TheOutdoorProgrammer/MAAS2
    description: "Stateless API for caching and serving Mars weather data from NASA's Curiosity rover."
    icon: game-icons:mars-curiosity

  - title: FishID
    url: https://fishid.theoutdoorprogrammer.com
    description: "AI-powered Ohio fish identification tool."
    icon: twemoji:fish

  - title: 'Hooked: Crestwater Bay'
    url: https://crestwaterbay.com/
    description: "A relaxing fishing adventure game with realistic mechanics, unique Hudson Bay fish species, and dynamic weather systems."
    icon: twemoji:fishing-pole

  - title: External DNS Firewalla Webhook
    url: https://github.com/TheOutdoorProgrammer/external-dns-firewalla-webhook
    description: "Webhook provider for external-dns that manages DNS records on Firewalla devices via dnsmasq configuration files."
    icon: mdi:dns

  - title: GitHub Commits to Profile
    url: https://github.com/TheOutdoorProgrammer/githubcommits2profile
    description: "Chrome extension that fixes GitHub commit author links to navigate to user profiles instead of repo-scoped commit lists."
    icon: mdi:source-commit

  - title: BinHub
    url: https://binhub.dev
    description: "Universal binary distribution platform for hosting pre-compiled CLI tools across multiple architectures."
    icon: mdi:package-variant-closed

  - title: Hunter Calendar Generator
    url: https://github.com/TheOutdoorProgrammer/huntercalgen
    description: "Python script that generates iCalendar files from hunting season CSV data with species, areas, and bag limits."
    icon: mdi:calendar

  - title: TF2Tofu
    url: https://github.com/TheOutdoorProgrammer/tf2tofu
    description: "Chromium extension that redirects Terraform registry and documentation links to their OpenTofu equivalents."
    icon: vscode-icons:file-type-opentofu

  - title: BankMap
    url: https://github.com/TheOutdoorProgrammer/bankmap
    description: "Data visualization of FDIC bank failures by state using Python and US shapefiles."
    icon: mdi:map-marker-multiple

  - title: MRPICKLE
    url: https://github.com/TheOutdoorProgrammer/MRPICKLE
    description: "An Opentofu module that manages login policies in Spacelift."
    icon: token-branded:pickle

  - title: Tofusible
    url: https://github.com/spacelift-solutions/tofusible
    description: "An ansible dynamic inventory that can be used with Spacelift stack dependencies."
    icon: vscode-icons:file-type-opentofu
