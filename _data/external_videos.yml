---
# Videos hosted on OTHER people's YouTube channels — conference talks, interviews,
# guest spots — that should still show up in the site's YouTube section.
#
# Why this file exists: _data/videos.yml is REGENERATED by CI on every run
# (scripts/fetch_youtube_videos.py, from my own channel feed), so anything added
# there gets clobbered and only my uploads ever appear. This file is hand-maintained
# and never touched by the sync. _includes/videos.html merges the two lists and sorts
# by date, so entries here slot in chronologically alongside my channel uploads.
#
# Schema mirrors videos.yml (YouTube watch URLs + thumbnails are global by video id,
# so nothing here is channel-specific):
#   - id:          the "v=" id from the watch URL (youtube.com/watch?v=<id>)
#     title:       display title
#     date:        YYYY-MM-DD the video was published (drives sorting)
#     description: short blurb (optional)
#     type:        "video" or "short"
#     source:      where it's hosted — for humans only, ignored by the template (optional)
videos:
- id: FPHDATV72Yo
  title: 'Tofu in Plain English: Live with Spacelift Intent'
  date: 2026-07-03
  description: 'My PlatformCon 2026 talk — a live demo of Spacelift Intent turning plain-English requests into production-ready OpenTofu.'
  type: video
  source: 'Platform Engineering (PlatformCon 2026)'
