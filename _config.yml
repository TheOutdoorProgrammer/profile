# Jekyll
theme: linkhub-jekyll-theme

plugins:
  - jekyll-sitemap
  - jekyll-paginate

paginate: 10
paginate_path: "/blog/page:num/"

# Site Configuration
name: Joey Stout  # Name of your website
tagline: "@TheOutdoorProgrammer"  # Set your preferred page title
description: ""  # Also used as a meta description
flags: 🇵🇸 🇺🇸 🇺🇦
favicon:
  path: /assets/images/favicon.svg # Path / URL to the favicon of your website (e.g., 'assets/images/favicon.png')
  type: svg+xml # File format of image. Change according to your image. Supported types: https://developer.mozilla.org/en-US/docs/Web/Media/Formats/Image_types
logo: https://avatars.githubusercontent.com/u/13936290 # Path / URL to the logo (e.g., 'assets/images/logo.png')
url: https://www.theoutdoorprogrammer.com # URL of your website
locale: en_US # The value specifies the locale in which these tags are marked up. It follows the format `language_TERRITORY`.
ga4: # Google Analytics 4 measurement ID, for e.g. G-XXXXXXX (optional). Remove it if it’s not needed.
image:
  path: /assets/images/og-image.png # Used for SEO (og:image)
  type: png # File format of image.
  height: 630 # Pixels
  width: 1200
  alt: The Outdoor Programmer — Joey Stout

gpg:
  fingerprint: 8E4C D7B8 4024 3BF4 FF54 58B8 1830 B516 B456 06F6

# Verified Badge Configuration
badge:
  enable: true # Set to 'true' or 'false' to enable / disable the badge
  icon: ri:verified-badge-fill  # Enter the icon name for the badge from Iconify Design (https://icon-sets.iconify.design/)
  color: '#dfb221'  # Define the color of the badge

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "blog/_posts"
      type: "posts"
    values:
      layout: "post"

# Exclude
exclude: [ README.md, Gemfile.lock, .jekyll-cache/, .github/, CHANGELOG.md, Gemfile, LICENSE.txt, funding.yml, linkhub-jekyll-theme.gemspec ]
