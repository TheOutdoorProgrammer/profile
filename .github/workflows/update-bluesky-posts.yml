name: Update Bluesky posts data

on:
  # Manually from Actions tab or via webhook
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Bluesky posts
        env:
          MAX_POSTS: 10
        run: |
          LANG=C.UTF-8 LC_ALL=C.UTF-8 curl -sS -H "Accept: application/json" "https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=theoutdoorprogrammer.com&limit=$MAX_POSTS" | \
          ruby -E UTF-8:UTF-8 -rjson -ryaml -e 'input = STDIN.read.force_encoding("UTF-8").encode("UTF-8", invalid: :replace, undef: :replace); puts JSON.parse(input).to_yaml' > _data/posts.yml

      - name: Fetch latest YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: UC_qK4g_mSlBNZ6Ht5adZ5zw
        run: |
          python3 - << 'PY'
          import json
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          import os

          api_key = os.environ.get("YOUTUBE_API_KEY", "").strip()
          channel_id = os.environ.get("YOUTUBE_CHANNEL_ID", "").strip()

          if not api_key:
            print("Missing YOUTUBE_API_KEY secret", file=sys.stderr)
            sys.exit(1)

          def get_json(url):
            req = urllib.request.Request(url, headers={"Accept": "application/json"})
            try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                return json.loads(resp.read().decode("utf-8"))
            except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              print(f"HTTP {e.code} for URL: {url}\n{body}", file=sys.stderr)
              raise

          def duration_seconds(iso):
            # PT1H2M3S / PT59S / PT12M
            m = re.match(r"^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$", iso or "")
            if not m:
              return 0
            h = int(m.group(1) or 0)
            mi = int(m.group(2) or 0)
            s = int(m.group(3) or 0)
            return h * 3600 + mi * 60 + s

          # Build short/video map from channel RSS (reliable for Shorts detection)
          rss_url = f"https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}"
          rss_xml = urllib.request.urlopen(rss_url, timeout=30).read().decode("utf-8", errors="replace")
          root = ET.fromstring(rss_xml)
          ns = {
            "atom": "http://www.w3.org/2005/Atom",
            "yt": "http://www.youtube.com/xml/schemas/2015",
          }
          short_by_id = {}
          for entry in root.findall("atom:entry", ns):
            vid_el = entry.find("yt:videoId", ns)
            if vid_el is None or not vid_el.text:
              continue
            href = ""
            for link in entry.findall("atom:link", ns):
              if link.attrib.get("rel") == "alternate":
                href = link.attrib.get("href", "")
                break
            short_by_id[vid_el.text] = "/shorts/" in href

          # Pull recent channel uploads (up to 50)
          search_qs = urllib.parse.urlencode({
            "part": "snippet",
            "channelId": channel_id,
            "order": "date",
            "type": "video",
            "maxResults": 50,
            "key": api_key,
          })
          search = get_json(f"https://www.googleapis.com/youtube/v3/search?{search_qs}")

          candidates = []
          ids = []
          for item in search.get("items", []):
            vid = item.get("id", {}).get("videoId")
            if not vid:
              continue
            title = item.get("snippet", {}).get("title", "")
            live_flag = item.get("snippet", {}).get("liveBroadcastContent", "none")
            candidates.append({"id": vid, "title": title, "liveFlag": live_flag})
            ids.append(vid)

          # Fetch durations and liveStreamingDetails in batches
          details_by_id = {}
          for i in range(0, len(ids), 50):
            batch = ids[i:i+50]
            videos_qs = urllib.parse.urlencode({
              "part": "contentDetails,liveStreamingDetails",
              "id": ",".join(batch),
              "maxResults": 50,
              "key": api_key,
            })
            videos = get_json(f"https://www.googleapis.com/youtube/v3/videos?{videos_qs}")
            for it in videos.get("items", []):
              details_by_id[it["id"]] = it

          shorts, videos = [], []
          for c in candidates:
            meta = details_by_id.get(c["id"], {})
            has_live_details = "liveStreamingDetails" in meta

            # Exclude live/stream content
            if c["liveFlag"] != "none" or has_live_details:
              continue

            item = {"id": c["id"], "title": c["title"]}
            is_short = short_by_id.get(c["id"], False)
            if is_short:
              item["type"] = "short"
              if len(shorts) < 10:
                shorts.append(item)
            else:
              item["type"] = "video"
              if len(videos) < 10:
                videos.append(item)

            if len(shorts) >= 10 and len(videos) >= 10:
              break

          def yq(s):
            # single-quoted YAML scalar
            return "'" + str(s).replace("'", "''") + "'"

          output = {"videos": videos + shorts}
          lines = ["---", "videos:"]
          for v in output["videos"]:
            lines.append(f"- id: {v['id']}")
            lines.append(f"  title: {yq(v['title'])}")
            lines.append(f"  type: {v['type']}")

          Path("_data/videos.yml").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(json.dumps(output, indent=2))
          PY

      - name: Commit and push changes (if any)
        run: |
          if git diff --quiet _data/posts.yml _data/videos.yml; then
            echo "No changes; skipping commit";
            exit 0;
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _data/posts.yml _data/videos.yml
          git commit -m "chore: update site data (Bluesky posts + YouTube videos)"
          git push
