name: Update Bluesky posts data

on:
  # Manually from Actions tab or via webhook
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Bluesky posts
        env:
          MAX_POSTS: 10
        run: |
          LANG=C.UTF-8 LC_ALL=C.UTF-8 curl -sS -H "Accept: application/json" "https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=theoutdoorprogrammer.com&limit=$MAX_POSTS" | \
          ruby -E UTF-8:UTF-8 -rjson -ryaml -e 'input = STDIN.read.force_encoding("UTF-8").encode("UTF-8", invalid: :replace, undef: :replace); puts JSON.parse(input).to_yaml' > _data/posts.yml

      - name: Fetch latest YouTube videos
        run: |
          # Fetch RSS feed
          curl -sS "https://www.youtube.com/feeds/videos.xml?channel_id=UC_qK4g_mSlBNZ6Ht5adZ5zw" > /tmp/yt_feed.xml

          # Parse RSS feed, then use yt-dlp to detect live videos
          ruby -rrexml/document -ryaml -rjson -e '
            doc = REXML::Document.new(File.read("/tmp/yt_feed.xml"))
            candidates = []
            doc.elements.each("feed/entry") do |entry|
              id = entry.elements["yt:videoId"].text
              title = entry.elements["title"].text
              link_el = entry.elements.to_a("link").find { |l| l.attributes["rel"] == "alternate" }
              href = link_el ? link_el.attributes["href"] : ""
              is_short = href.include?("/shorts/")
              candidates << {id: id, title: title, short: is_short}
            end

            STDERR.puts "=== Candidates (#{candidates.size}) ==="

            # Use yt-dlp to check live_status for each video
            filtered = candidates.select do |c|
              json_str = `yt-dlp --dump-json --no-download --skip-download "https://www.youtube.com/watch?v=#{c[:id]}" 2>/dev/null`
              meta = JSON.parse(json_str) rescue {}
              live_status = meta["live_status"] || "none"
              was_live = live_status == "was_live" || live_status == "is_live"
              STDERR.puts "  #{c[:id]} | live_status=#{live_status} | was_live=#{was_live} | #{c[:title]}"
              !was_live
            end

            STDERR.puts "=== Filtered (#{filtered.size}) ==="

            shorts = filtered.select { |c| c[:short] }.first(10)
            vids = filtered.reject { |c| c[:short] }.first(10)
            all = (vids + shorts).map { |c| {"id" => c[:id], "title" => c[:title], "type" => c[:short] ? "short" : "video"} }
            puts({"videos" => all}.to_yaml)
          ' > _data/videos.yml

          echo "=== Generated videos.yml ==="
          cat _data/videos.yml

      - name: Commit and push changes (if any)
        run: |
          if git diff --quiet _data/posts.yml _data/videos.yml; then
            echo "No changes; skipping commit";
            exit 0;
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _data/posts.yml _data/videos.yml
          git commit -m "chore: update site data (Bluesky posts + YouTube videos)"
          git push
