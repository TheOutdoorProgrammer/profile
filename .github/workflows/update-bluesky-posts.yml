name: Update Bluesky posts data

on:
  # Manually from Actions tab or via webhook
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest YouTube videos and bluesky posts
        env:
          MAX_POSTS: 10
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IS_CLOUDFLARE_PAGES: false
        run: ./build.sh

      - name: Commit and push changes (if any)
        run: |
          # Guard: if videos.yml only lost lines (Shorts dropped from API), revert it
          if ! git diff --quiet _data/videos.yml; then
            additions=$(git diff --numstat _data/videos.yml | awk '{print $1}')
            if [ "$additions" = "0" ]; then
              echo "::warning::videos.yml has only removals — likely Shorts dropped from API; reverting"
              git checkout _data/videos.yml
            fi
          fi

          if git diff --quiet _data/posts.yml _data/videos.yml; then
            echo "No changes; skipping commit";
            exit 0;
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _data/posts.yml _data/videos.yml
          git commit -m "chore: update site data (Bluesky posts + YouTube videos)"
          git push
