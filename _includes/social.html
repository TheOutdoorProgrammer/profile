<div class="social-links">
    {% for button in site.data.links.buttons %}
    {% if button.type == 'list' %}
    {% for item in button.items %}
    <a class="social-icon" href="{{ item.url }}" target="_blank" aria-label="{{ item.title }}" title="{{ item.title }}">
        <span class="iconify-inline" data-icon="{{ item.icon }}"></span>
    </a>
    {% endfor %}
    {% endif %}
    {% endfor %}
    {% for social in site.data.social %}
    <a class="social-icon" href="{{ social.url }}" target="_blank" aria-label="{{ social.name }}" title="{{ social.name }}">
        <span class="iconify-inline" data-icon="{{ social.icon }}"></span>
    </a>
    {% endfor %}
</div>
